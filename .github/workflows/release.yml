# main에서 수동 실행(gh workflow run release.yml --ref main)하면 Windows·macOS·Ubuntu 설치 파일을 빌드·서명해 GitHub Release로 올린다.
# 태그(v<버전>)는 create-release 잡이 실행한 커밋을 가리키는 초안으로 만들고, 공개할 때 생긴다.
# 태그 푸시로 돌리지 않는 이유: Actions 캐시는 ref별이라 태그 실행은 이전 태그의 Rust 캐시를 못 읽는다. main에서 돌려야 캐시가 쌓인다.
# 초안(draft) 릴리스를 create-release 잡에서 하나만 만들고, 각 플랫폼은 그 id(releaseId)로 올려 latest.json을 합친다.
# 플랫폼마다 tauri-action이 초안을 찾게 두면 못 찾고 따로 만드는 일이 있었다(v0.9.8·v0.15.0 에 macOS 가 빠짐).
# 모두 끝나면 publish 잡이 공개한다.
# 설치된 앱은 latest.json을 보고 자동 업데이트한다.
# 필요한 시크릿: TAURI_SIGNING_PRIVATE_KEY (~/.tauri/seadrive.key 내용), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (비워 둔 키면 빈 값)
# 선택 시크릿(macOS 정식 서명·공증, 없으면 ad-hoc 서명): docs/macos-release.md 참고
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
      body: ${{ steps.create.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      # CHANGELOG.md의 "## v<버전>" 섹션이 릴리스 본문이자 latest.json의 notes(앱 업데이트 알림)가 된다
      - name: 초안 릴리스 만들기
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          body=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$body" ]; then echo "::error::CHANGELOG.md에 '## $v' 섹션이 없다"; exit 1; fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$v" -f target_commitish="$GITHUB_SHA" -f name="Drive $v" -f body="$body" -F draft=true -F prerelease=false --jq .id)
          { echo "id=$id"; echo "tag=$v"; echo "body<<__NOTES__"; echo "$body"; echo "__NOTES__"; } >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # 22.04로 빌드해야 더 오래된 glibc에서도 돈다(22.04 이상 Ubuntu에서 실행)
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal 빌드는 두 아키텍처가 모두 필요하다
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux 빌드 의존성
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test
      - run: npm run lint

      # Apple 인증서 시크릿이 있을 때만 넘긴다. 빈 값으로 넘기면 Tauri가 빈 인증서를 가져오려다 실패한다
      - name: Apple 서명 설정
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Apple 인증서 없음: ad-hoc 서명으로 빌드한다"
            exit 0
          fi
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!k}" ] && echo "$k=${!k}" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # releaseId 로 올릴 곳을 정하고, tagName 은 latest.json 주소(없으면 releases/latest 로 감), releaseBody 는 그 notes 에 쓰인다
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseBody: ${{ needs.create-release.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}

  # 모든 플랫폼이 올라간 뒤에 공개해야 latest/download/latest.json에 모든 플랫폼이 들어 있다
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: 릴리스 공개
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.id }}" -F draft=false -f make_latest=true
